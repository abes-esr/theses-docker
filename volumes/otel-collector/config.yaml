receivers:
  docker_stats:
    api_version: "1.54"
    excluded_images:
      - theses-elasticsearch-01

processors:
  resource:
    attributes:
      - key: service.name
        value: theses-elasticsearch-01
        action: upsert
      - key: deployment.environment
        value: ${OTEL_ENVIRONMENT}
        action: upsert
      - key: service.namespace
        value: ${OTEL_NAMESPACE}
        action: upsert

exporters:
  otlp:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT_GRPC}
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors: [resource]
      exporters: [otlp]
